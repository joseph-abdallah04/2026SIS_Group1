name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint, typecheck, build, test
    runs-on: ubuntu-latest
    env:
      # Not a real secret — just satisfies env.ts's min-length check so tests
      # that import env.ts (e.g. auth's jwt.test.ts) can run in CI.
      JWT_SECRET: ci-placeholder-secret-not-used-in-production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run generate --workspace @roundtable/server

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test
