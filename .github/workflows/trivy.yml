name: Trivy Security Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  trivy-scan:
    name: Run Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # trivy-action already caches its vulnerability DB internally (its own
      # "Restore DB from cache" step, keyed by date) — a previous attempt to
      # add a second cache step here (key `trivy-db-${{ github.run_id }}`,
      # unique every run so it never actually hit) was also redundant: this
      # step's own `TRIVY_CACHE_DIR` env always overrides whatever the outer
      # workflow sets, so the custom cache dir was never even read. Removed
      # rather than patched — nothing to configure here, it just works.
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: 'trivy-results.sarif'
