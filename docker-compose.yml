# Local Postgres for development only. Migrations run against this container
# (`npm run db:migrate`), never against Neon — see README "Database" section.
services:
  postgres:
    image: postgres:16
    container_name: roundtable-database
    restart: unless-stopped
    environment:
      POSTGRES_USER: roundtable
      POSTGRES_PASSWORD: roundtable
      POSTGRES_DB: roundtable
    ports:
      # Host port 5433 avoids clashing with a native/Homebrew Postgres a dev
      # may already have running on the standard 5432. Container-internal
      # port stays 5432 — only the host-side mapping changes.
      - '5433:5432'
    volumes:
      - roundtable_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U roundtable -d roundtable']
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  roundtable_postgres_data:
